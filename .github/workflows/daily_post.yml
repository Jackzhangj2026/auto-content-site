# Auto Content Site - 每日自动生成文章并发布
# 每天自动运行，无需任何人工操作
name: 每日自动发布

on:
  schedule:
    # 北京时间每天早上8点运行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

# 允许 Pages 部署
permissions:
  contents: write
  pages: write
  id-token: write

# 只保留一次部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成今日文章
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python content_generator.py

      - name: 提交新文章到仓库
        run: |
          git config user.name "Auto Content Bot"
          git config user.email "bot@example.com"
          git add _posts/
          git diff --staged --quiet || git commit -m "每日自动更新：$(date +'%Y-%m-%d') 新文章"
          git push

      - name: 构建静态页面
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3

      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
